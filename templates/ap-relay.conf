# /etc/ap-relay.conf
# ---------------------------------------------------------------------------
# 所有脚本的唯一变量来源。改完执行：
#   sudo systemctl restart ap-hostapd ap-dnsmasq ap-mihomo ap-firewall
#
# 三条一致性约束（写错会静默失效，很坑）：
#   1. AP_CIDR 与 AP_NET 必须是同一网段：前者带掩码，后者不带
#   2. DHCP_START / DHCP_END 必须落在 AP_NET 内，且不要包含 AP_IP
#   3. TUN_DEV、DNS_PORT、GLOBAL_PORT、UI_PORT 必须与 mihomo 配置里的
#      tun.device、dns.listen、mixed-port、external-controller 一致
#      （用 ap-render.sh 渲染模板可自动同步）
# ---------------------------------------------------------------------------

# ========== 接口 ==========

# 上行接口：连上游 WiFi 的那张网卡。
# 单卡 AP+STA：填无线网卡；有线上行：填 eth0。
STA_IF=wlan0

# NAT 出接口。默认跟随 STA_IF；有线上行时改成 eth0。
UPLINK_IF=wlan0

# 热点接口。运行时由 ap-prep.sh 用 `iw interface add` 创建，
# 不要和系统里已有的接口重名。
AP_IF=wlan1

# ========== 热点网段 ==========

# 网关地址，同时也是下发给客户端的 DNS。
AP_IP=192.168.43.1

# 配在 AP 接口上的地址（带掩码）。
AP_CIDR=192.168.43.1/24

# 网段（不带主机位），用于路由和 NAT。
AP_NET=192.168.43.0/24

# DHCP 池。必须落在 AP_NET 内。
DHCP_START=192.168.43.10
DHCP_END=192.168.43.200

# ========== mihomo ==========
# 这一节的值由 mihomo-render.sh 渲染进 /etc/mihomo/config.yaml。
# 改完执行：
#   sudo mihomo-apply.sh          # 渲染 + 校验 + 备份 + 重启
#
# 注意：本文件是被 `source` 的 shell 片段，含空格或特殊字符的值必须加引号，
# 例如 PROXY_SERVER_NS='[...]'、EXCLUDE_FILTER='(?i)...'。
#
# SECRET 与 SUB_URL 是凭据，绝不写在这里，写进 /etc/ap-relay.local.conf：
#   SECRET='...'
#   SUB_URL='https://...'
# 仓库与模板里不出现真实值。

# TUN 设备名，必须与 mihomo 的 tun.device 一致。
TUN_DEV=meta

# 手机走 TUN。路由器用 redirect 模式，对应值见
# platforms/padavan/mihomo.conf。
TUN_ENABLE=true
TUN_STACK=mixed
# 自动根据路由表挑选出口网卡；上行固定时设为 false。
TUN_AUTO_DETECT_INTERFACE=true

# ---- 监听 / 日志 ----
ALLOW_LAN=true
BIND_ADDRESS='*'
LOG_LEVEL=warning
UI_BIND=0.0.0.0

# ---- 订阅 ----
# SUB_URL 在 /etc/ap-relay.local.conf，本文件只放非敏感项。
PROVIDER_NAME=juzi
SUB_UA=clash-verge/v2.0.0
SUB_INTERVAL=21600
EXCLUDE_FILTER='(?i)回家页|查看公告'
HEALTH_CHECK_INTERVAL=180

# ---- geo 数据自动更新 ----
# 间隔单位是小时；2160 = 90 天。
GEO_AUTO_UPDATE=true
GEO_UPDATE_INTERVAL=2160

# ---- DNS ----
# 节点/订阅域名用哪个 DNS 解析。必须是 DoH：上游若劫持明文 53，
# 这里写 IP 会把节点域名解析成 fake-ip，表现为所有节点测速超时。
PROXY_SERVER_NS='[https://dns.alidns.com/dns-query]'

# ---- sniffer ----
# redirect 模式必须 true（否则规则按 IP 匹配，域名规则失效）；TUN 模式 false。
SNIFFER_OVERRIDE_DESTINATION=false
SNIFFER_HTTP_PORTS='[80, 8080-8880]'

# 整行变量：redirect 填 `redir-port: 1009`；TUN 模式把整行注释掉。
REDIR_LINE='# redir-port: 不用（走 TUN）'

# ========== 端口 ==========
# 所有端口集中在这里，方便全局替换。
# 修改后执行：
#   sudo systemctl restart ap-hostapd ap-dnsmasq ap-mihomo ap-firewall

# mihomo 代理端口（HTTP + SOCKS 共用），必须与 mixed-port 一致。
GLOBAL_PORT=1008

# mihomo 的 DNS 监听端口，必须与 dns.listen 一致。
# mihomo 只监听 127.0.0.1，dnsmasq 只监听 AP 接口，两者可同时用 53；
# 这里用 1053 避开上游可能劫持的 53。
DNS_PORT=1053

# dns.listen 的完整值。路由器要多机共享时改成 0.0.0.0:1053。
DNS_LISTEN=127.0.0.1:1053

# 面板 + REST API 端口，必须与 external-controller 一致。
UI_PORT=7070

# dnsmasq 对客户端提供 DNS 的端口（标准 53，一般不要改）。
DNS_STD_PORT=53

# dnsmasq DHCP 端口（标准 67，一般不要改）。
DHCP_PORT=67

# 需要拦截的 QUIC 端口（通常 443）。
QUIC_PORT=443

# mihomo sniffer 识别的端口。HTTP_ALT_START/END 是一个范围。
HTTP_PORT=80
HTTP_ALT_START=8080
HTTP_ALT_END=8880
TLS_PORT=443
TLS_ALT_PORT=8443

# ========== 策略路由 ==========

# 自定义路由表号（1-252 之间挑一个没被占用的）。
TABLE_ID=100

# 规则优先级，数字越小越先匹配。
# 必须小于 main 表的 32766，且不要与系统已有规则冲突。
RULE_PREF=11000
