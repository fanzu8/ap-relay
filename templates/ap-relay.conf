# /etc/ap-relay.conf
# ---------------------------------------------------------------------------
# 所有脚本的唯一变量来源。改完执行：
#   sudo systemctl restart ap-hostapd ap-dnsmasq ap-mihomo ap-firewall
#
# 三条一致性约束（写错会静默失效，很坑）：
#   1. AP_CIDR 与 AP_NET 必须是同一网段：前者带掩码，后者不带
#   2. DHCP_START / DHCP_END 必须落在 AP_NET 内，且不要包含 AP_IP
#   3. TUN_DEV、DNS_PORT、GLOBAL_PORT、UI_PORT 必须与 mihomo 配置里的
#      tun.device、dns.listen、mixed-port、external-controller 一致
#      （用 ap-render.sh 渲染模板可自动同步）
# ---------------------------------------------------------------------------

# ========== 接口 ==========

# 上行接口：连上游 WiFi 的那张网卡。
# 单卡 AP+STA：填无线网卡；有线上行：填 eth0。
STA_IF=wlan0

# NAT 出接口。默认跟随 STA_IF；有线上行时改成 eth0。
UPLINK_IF=wlan0

# 热点接口。运行时由 ap-prep.sh 用 `iw interface add` 创建，
# 不要和系统里已有的接口重名。
AP_IF=wlan1

# ========== 热点网段 ==========

# 网关地址，同时也是下发给客户端的 DNS。
AP_IP=192.168.43.1

# 配在 AP 接口上的地址（带掩码）。
AP_CIDR=192.168.43.1/24

# 网段（不带主机位），用于路由和 NAT。
AP_NET=192.168.43.0/24

# DHCP 池。必须落在 AP_NET 内。
DHCP_START=192.168.43.10
DHCP_END=192.168.43.200

# ========== mihomo ==========

# TUN 设备名，必须与 mihomo 的 tun.device 一致。
TUN_DEV=meta

# ========== 端口 ==========
# 所有端口集中在这里，方便全局替换。
# 修改后执行：
#   sudo systemctl restart ap-hostapd ap-dnsmasq ap-mihomo ap-firewall

# mihomo 代理端口（HTTP + SOCKS 共用），必须与 mixed-port 一致。
# 默认沿用 Clash / mihomo 社区常见的 7890。
GLOBAL_PORT=7890

# mihomo 的 DNS 监听端口，必须与 dns.listen 一致。
# 默认用标准 53：mihomo 只监听 127.0.0.1，dnsmasq 只监听 AP 接口，
# 两者可以同时使用 53。如果本机 127.0.0.1:53 已被占用，
# 可以改成 1053 等空闲端口（同时改 dns.listen）。
DNS_PORT=53

# 面板 + REST API 端口，必须与 external-controller 一致。
# 默认沿用 Clash / mihomo 社区常见的 9090。
UI_PORT=9090

# dnsmasq 对客户端提供 DNS 的端口（标准 53，一般不要改）。
DNS_STD_PORT=53

# dnsmasq DHCP 端口（标准 67，一般不要改）。
DHCP_PORT=67

# 需要拦截的 QUIC 端口（通常 443）。
QUIC_PORT=443

# mihomo sniffer 识别的端口。HTTP_ALT_START/END 是一个范围。
HTTP_PORT=80
HTTP_ALT_START=8080
HTTP_ALT_END=8880
TLS_PORT=443
TLS_ALT_PORT=8443

# ========== 策略路由 ==========

# 自定义路由表号（1-252 之间挑一个没被占用的）。
TABLE_ID=100

# 规则优先级，数字越小越先匹配。
# 必须小于 main 表的 32766，且不要与系统已有规则冲突。
RULE_PREF=11000
