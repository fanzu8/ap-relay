# /etc/ap-hotspot.conf
# ---------------------------------------------------------------------------
# 热点的唯一配置源。改完执行：
#   sudo systemctl restart ap-hostapd
# （ap-gen.sh 会重新渲染 /etc/hostapd/ap.conf，不要手改生成物）
# ---------------------------------------------------------------------------

# 频段：24g | 5g
BAND=5g

# 两个频段分开命名（建议 5G 加 _5G 后缀，客户端一眼能区分）
SSID_24="CHANGE_ME_2G"
SSID_5G="CHANGE_ME_5G"

# WPA2 密码：至少 8 位。别用默认值。
PASS="CHANGE_ME_STRONG_PASSWORD"

# ========== 信道与带宽 ==========
# 2.4G 建议只用 1 / 6 / 11（互不重叠）。
CHANNEL_24=6

# 5G 信道：中国区常用 36-64、149-165。
# 52-64 属于 DFS 信道，部分固件/地区会拒绝或需要雷达检测，尽量避开。
CHANNEL_5=149

# 5G 带宽：20 | 40 | 80。
# 80MHz 需要连续信道；与 STA 同频段时会加剧空口争用。
WIDTH_5=80

# ========== 稳定性 ==========
# 组密钥轮换间隔（秒）。0 = 关闭。
# 某些固件在轮换时重装密钥会超时（日志里的 -110），关掉可规避。
GROUP_REKEY=0

# 设备特定：部分 ath10k 固件在 cryptmode>0 时会导致整张无线网卡消失。
# 非 ath10k 硬件可以忽略这一项，保持 0。
CRYPTMODE=0
