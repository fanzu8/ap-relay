# /etc/storage/mihomo.conf（Padavan / MI-R3G）
# ---------------------------------------------------------------------------
# 路由器侧的 mihomo 渲染变量。部署时复制到 /etc/storage/mihomo.conf，
# 再由 mihomo-vars.sh 自动载入（它探测到这个文件就当作平台配置）。
#
# 与手机侧 /etc/ap-relay.conf 用的是同一份模板
# （templates/mihomo.config.yaml）和同一套脚本（scripts/mihomo-*.sh），
# 差异只体现在这份变量文件里。
#
# 注意：本文件是被 `source` 的 shell 片段，含空格或特殊字符的值必须加引号。
#
# SECRET 与 SUB_URL 是凭据，写到 /etc/storage/mihomo.local.conf：
#   SECRET='...'
#   SUB_URL='https://...'
# 仓库与模板里不出现真实值。
# ---------------------------------------------------------------------------

# ---- 端口 ----
# mixed（HTTP/SOCKS5）
GLOBAL_PORT=1008
# DNS（fake-ip）
DNS_PORT=1053
# 面板 + REST API
UI_PORT=7070

# ---- 监听 / 日志 ----
ALLOW_LAN=true
BIND_ADDRESS='*'
LOG_LEVEL=warning
UI_BIND=0.0.0.0

# ---- 模式 ----
# 路由器默认走 redirect（iptables REDIRECT），不开 TUN。
TUN_DEV=meta
TUN_ENABLE=false
TUN_STACK=gvisor
TUN_AUTO_DETECT_INTERFACE=false

# redir-port 是启动期参数，必须整行存在。
REDIR_LINE='redir-port: 1009'

# redirect 模式下 DNS 要对 LAN 提供服务，且 sniffer 必须改写目标。
DNS_LISTEN=0.0.0.0:1053
SNIFFER_OVERRIDE_DESTINATION=true
SNIFFER_HTTP_PORTS='[80, 8080]'

# ---- 订阅 ----
PROVIDER_NAME=juzi
SUB_UA=clash-verge/v2.0.0
SUB_INTERVAL=21600
EXCLUDE_FILTER='(?i)回家页|查看公告'
HEALTH_CHECK_INTERVAL=180

# ---- geo 数据自动更新 ----
GEO_AUTO_UPDATE=true
GEO_UPDATE_INTERVAL=2160

# ---- DNS ----
# 节点/订阅域名解析必须用 DoH（上游会劫持明文 53）。
# 这台路由器现网验证过的是 nmsls 两个入口；换成手机同款 alidns 也等价：
#   PROXY_SERVER_NS='[https://dns.alidns.com/dns-query]'
PROXY_SERVER_NS='[https://query.nmsls.pub/dns-query, tls://query.nmsls.pub:8453]'
